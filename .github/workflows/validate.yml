name: Validate preserved research
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'
      - run: python reproduce.py verify
      - run: python reproduce.py tests
      - run: python reproduce.py smoke
      - run: python analysis/plot_results.py --verify-only
      - run: python analysis/test_plot_validation.py
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r analysis/requirements.txt
      - run: python analysis/plot_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-figures
          path: figures/rebuild_*
