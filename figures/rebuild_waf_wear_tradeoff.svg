   <text style="fill: #243347; font: 700 16px 'DejaVu Sans'; text-anchor: middle" x="409.268125" y="19.3575" transform="rotate(-0 409.268125 19.3575)">Lower WAF comes with higher erase-count imbalance</text>
  </g>
  <g id="text_24">
   <text style="fill: #4b5e70; font: 9.4px 'DejaVu Sans'" transform="translate(129.016672 386.612113)">Harmful = Static WAF &gt; paired Device-only WAF; 4–5 error-rate conditions per final seed, not 21 independent samples.</text>
   <text style="fill: #4b5e70; font: 9.4px 'DejaVu Sans'" transform="translate(170.602859 397.138056)">Wear CV = population SD of block erase counts / their mean, over all 40 simulated blocks at run end.</text>
   <text style="fill: #4b5e70; font: 9.4px 'DejaVu Sans'" transform="translate(132.730406 407.664)">Each point is a paired (seed, error-rate) delta. Erase-count balance is not measured NAND endurance or SSD lifetime.</text>
  </g>
